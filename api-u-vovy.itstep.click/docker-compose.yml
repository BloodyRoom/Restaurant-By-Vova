version: "3.9"

networks:
  vovy_net:
    driver: bridge

services:
  db:
    image: postgres:18.1
    container_name: u-vovy-db-container
    restart: unless-stopped
    ports:
      - "5475:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ${VOLUME_POSTGRES}
    networks:
      - vovy_net

  api:
    image: novakvova/api-u-vovy:latest
    container_name: api-u-vovy-container
    restart: unless-stopped
    volumes:
      - ${VOLUME_SERVERAPI}
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__RestaurantConnection: "Host=db;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
    ports:
      - "0.0.0.0:4226:8080"
    depends_on:
      - db
    networks:
      - vovy_net
      
  front:
    image: novakvova/u-vovy:latest
    container_name: u-vovy_front
    ports:
      - "4007:80"

  db-backup:
    image: postgres:18.1
    container_name: u-vovy-db-backup
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ${VOLUME_POSTGRES}:/var/lib/postgresql/data
      - ./backups:/backups
    networks:
      - vovy_net
    entrypoint: >
      sh -c "
        while true; do
          TIMESTAMP=$(date +'%Y%m%d%H%M%S')
          pg_dump -h db -U ${POSTGRES_USER} ${POSTGRES_DB} | gzip > /backups/db_$TIMESTAMP.sql.gz
          
          sleep 86400
        done
      "
